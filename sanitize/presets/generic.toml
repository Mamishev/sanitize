# Общий профиль: те же категории, что и в bitrix, но без Битрикс-специфики
# (AGENTS.md, раздел 6): без only_under/ext_only_under, без Битрикс-исключений,
# без рискованных каталогов и маркеров Битрикс.

[preset]
id = "generic"
title = "Общий"
markers = []

[dirs]
excluded = ["vendor", "node_modules", ".git", ".svn", ".hg", ".idea", ".vscode"]
risky = []

[categories.docs]
title = "Документы"
extensions = [
    ".pdf", ".doc", ".docx", ".docm", ".dot", ".dotx", ".rtf", ".odt", ".ott",
    ".pages", ".epub", ".djvu", ".xps", ".oxps", ".txt", ".md",
]
risk = "medium"

[categories.sheets]
title = "Таблицы и экспорт"
extensions = [
    ".xls", ".xlsx", ".xlsm", ".xlsb", ".ods", ".csv", ".tsv", ".numbers",
    ".xml", ".json", ".yaml", ".yml",
]
risk = "high"

[categories.slides]
title = "Презентации"
extensions = [".ppt", ".pptx", ".pptm", ".pps", ".ppsx", ".odp"]
risk = "medium"

[categories.archives]
title = "Архивы"
extensions = [
    ".zip", ".rar", ".7z", ".tar", ".gz", ".tgz", ".bz2", ".xz", ".zst",
    ".tar.gz", ".tar.bz2", ".tar.xz", ".cab", ".arj", ".lzh", ".iso", ".dmg",
]
risk = "high"

[categories.keys]
title = "Подписи и ключи"
extensions = [
    ".sig", ".p7s", ".p7b", ".cer", ".crt", ".der", ".pem", ".key", ".p12",
    ".pfx", ".jks", ".keystore", ".ppk", ".asc", ".gpg", ".pgp", ".kdbx", ".kdb",
]
names = ["id_rsa", "id_dsa", "id_ecdsa", "id_ed25519"]
risk = "high"

[categories.backups]
title = "Бэкапы и дампы"
extensions = [
    ".sql", ".sql.gz", ".dump", ".bak", ".backup", ".enc", ".mdb", ".accdb",
    ".sqlite", ".sqlite3", ".db", ".fdb", ".dbf",
]
risk = "high"

[categories.mail]
title = "Почта и контакты"
extensions = [".eml", ".msg", ".pst", ".ost", ".mbox", ".vcf", ".ics"]
risk = "high"

[categories.media]
title = "Аудио и видео"
extensions = [
    ".mp3", ".wav", ".ogg", ".m4a", ".amr", ".mp4", ".webm", ".mov", ".avi", ".mkv",
]
default_enabled = false
risk = "low"

[categories.logs]
title = "Логи и кэш"
extensions = [".log", ".tmp", ".temp", ".swp"]
name_patterns = ["*.log.*", ".~lock*"]
risk = "medium"

[categories.secrets_report]
title = "Конфиги с секретами"
names = [".env", ".htpasswd", ".my.cnf", ".pgpass", ".netrc"]
name_patterns = [".env.*"]
risk = "high"
report_only = true
