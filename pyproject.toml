[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sanitize"
version = "0.1.0"
description = "Утилита поиска и обезвреживания файлов с ПДн и секретами в веб-проектах (1С-Битрикс)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "sanitize contributors" }]
keywords = ["bitrix", "personal-data", "security", "sanitizer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.scripts]
sanitize = "sanitize.cli:main"
sanitize-gui = "sanitize.gui.app:main"

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
magic = ["python-magic>=0.4.27"]
tui = ["textual>=0.60"]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["sanitize"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["sanitize", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
# Документация и комментарии в проекте на русском языке:
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Qt-переопределения обязаны быть в camelCase (resizeEvent, closeEvent, ...)
"sanitize/gui/*" = ["N802"]
"tests/*" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["sanitize/core"]

[[tool.mypy.overrides]]
module = ["magic"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
